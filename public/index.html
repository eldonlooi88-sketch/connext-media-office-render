<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connext Media AI 办公室</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#16181d;color:#f4f4f2}
#app{max-width:900px;margin:0 auto;padding:20px}
.card{background:#1d2026;border-radius:12px;padding:16px;margin:12px 0}
button{background:#ff5a36;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}
#msgs{min-height:200px;background:#23262d;padding:12px;border-radius:8px;margin:10px 0}
.m{margin:8px 0;padding:8px;border-radius:8px}
.m.me{background:#ff5a36;text-align:right}
.m.bot{background:#2a2d35}
</style>
</head>
<body>
<div id="app">
  <h1>CONNEXT MEDIA · AI 办公室</h1>
  <div class="card">
    <h3>团队成员</h3>
    <div id="team"></div>
  </div>
  <div class="card">
    <h3>和 Grok（COO）对话</h3>
    <div id="msgs"></div>
    <input id="input" style="width:70%;padding:10px;border-radius:8px;border:1px solid #444;background:#1d2026;color:#fff" placeholder="输入消息...">
    <button onclick="send()">发送</button>
  </div>
</div>
<script>
const team = ['Eldon（老板）','Grok（COO）','美术总监','调查员 A-F','脚本员 1-2','设计师','影片生成师','影片剪辑师','写文案专员','法官','检察官','辩护律师'];
document.getElementById('team').innerHTML = team.map(t=>`<div style="padding:4px 0">${t}</div>`).join('');
async function send(){
  const input = document.getElementById('input');
  const text = input.value.trim(); if(!text) return;
  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="m me">${text}</div>`;
  input.value = '';
  msgs.innerHTML += `<div class="m bot">思考中...</div>`;
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]})});
    const j = await r.json();
    msgs.lastElementChild.textContent = j.reply || j.error || '无法回复';
  }catch(e){ msgs.lastElementChild.textContent = '网络错误'; }
  msgs.scrollTop = msgs.scrollHeight;
}
</script>
</body>
</html>
