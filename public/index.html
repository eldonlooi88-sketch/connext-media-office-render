<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connext Media AI 办公室</title>
<style>
body{margin:0;overflow:hidden;background:#e9e6e0;font-family:system-ui}
#ui{position:fixed;top:12px;left:12px;right:12px;background:rgba(22,24,29,.9);color:#fff;padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;z-index:10}
#side{position:fixed;right:12px;top:70px;bottom:12px;width:300px;background:rgba(22,24,29,.9);color:#fff;border-radius:12px;padding:12px;overflow:auto;z-index:10}
.bot{padding:6px 0;border-bottom:1px solid #333;font-size:13px}
#chat{margin-top:10px}
#msgs{height:200px;overflow:auto;background:#1a1c22;padding:8px;border-radius:8px;margin:8px 0;font-size:13px}
.m{margin:4px 0;padding:6px;border-radius:6px}
.me{background:#ff5a36;text-align:right}
.botm{background:#2a2d35}
input,button{padding:8px;border-radius:6px;border:1px solid #444;background:#23262d;color:#fff}
button{background:#ff5a36;border:0;cursor:pointer}
</style>
</head>
<body>
<div id="ui"><b>CONNEXT MEDIA · AI 办公室</b><span id="status">加载中...</span></div>
<div id="side">
  <div id="team"></div>
  <div id="chat">
    <div id="msgs"></div>
    <input id="inp" placeholder="和 Grok 对话..." style="width:70%">
    <button onclick="send()">发送</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const roster = [
  {n:'Eldon',r:'老板',c:'#c9a24a'},{n:'Grok',r:'COO',c:'#1f6feb'},{n:'美术总监',r:'美术',c:'#d6336c'},
  {n:'调查员A',r:'调查',c:'#2fb380'},{n:'调查员B',r:'调查',c:'#20a39e'},{n:'调查员C',r:'调查',c:'#4caf50'},
  {n:'脚本员1',r:'脚本',c:'#f08c00'},{n:'设计师',r:'设计',c:'#ae3ec9'},{n:'影片生成师',r:'生成',c:'#e03131'},
  {n:'法官',r:'法官',c:'#212529'},{n:'检察官',r:'控方',c:'#c92a2a'},{n:'辩护律师',r:'辩方',c:'#2b8a3e'}
];
document.getElementById('team').innerHTML = roster.map(b=>`<div class="bot"><b style="color:${b.c}">${b.n}</b> · ${b.r}</div>`).join('');

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e9e6e0');
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 30, 40);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 30, 15);
scene.add(sun);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.MeshLambertMaterial({color:0xfafafa}));
floor.rotation.x = -Math.PI/2;
scene.add(floor);

roster.forEach((b,i)=>{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.35,0.5,12), new THREE.MeshLambertMaterial({color:b.c}));
  body.position.y = 0.25;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16), new THREE.MeshLambertMaterial({color:0xffe0c0}));
  head.position.y = 0.8;
  g.add(head);
  g.position.set(-15 + (i%6)*5, 0, -5 + Math.floor(i/6)*6);
  scene.add(g);
});

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
document.getElementById('status').textContent = '已加载';

async function send(){
  const inp = document.getElementById('inp');
  const t = inp.value.trim(); if(!t) return;
  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="m me">${t}</div>`;
  inp.value = '';
  msgs.innerHTML += `<div class="m botm">...</div>`;
  try{
    const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:t}]})});
    const j = await r.json();
    msgs.lastElementChild.textContent = j.reply || j.error || '无法回复';
  }catch(e){ msgs.lastElementChild.textContent = '错误'; }
  msgs.scrollTop = 9999;
}
</script>
</body>
</html>
