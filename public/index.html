<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#16181d">
<title>Connext Media AI 办公室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 一家热闹、高级的 AI 影片工作室总部，像在看一座会动的模型屋
   IDEA: 建筑模型 + 直播控制台 —— 3D 场景是主角，界面是贴在玻璃上的炭灰色控制条
   PICTURE: 全屏 Three.js 办公室：木地板、黑框玻璃隔间、大头角色、气泡状态
   COLOUR and TYPE: 木 + 白 + 炭灰，品牌强调色珊瑚橙 #ff5a36；Outfit（品牌字）+ Noto Sans SC
   LAYOUT: 场景铺满；顶栏 + 右侧面板（手机为底部抽屉）+ 左下图例 */
:root{--ink:#16181d;--panel:rgba(22,24,29,.9);--line:rgba(255,255,255,.1);--acc:#ff5a36;--txt:#f4f4f2;--mut:#a3a7b0;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#e9e6e0;font:14px/1.45 "Noto Sans SC",system-ui,-apple-system,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;will-change:transform}
.lab .st{font-size:11px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;background:#fff;color:#1b1d22;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;gap:4px}
.lab .st i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.lab .nm{font-size:10.5px;font-weight:600;color:#fff;background:rgba(20,22,27,.75);padding:1px 6px;border-radius:4px}
.lab .say{display:none;max-width:230px;white-space:normal;font-size:12px;line-height:1.4;background:#fff;color:#16181d;padding:6px 10px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.22);position:relative;margin-bottom:4px;font-weight:500;text-align:left}
.lab .say:after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.lab .say.on{display:block}
.lab .say.angry{background:#ff4d3d;color:#fff;font-weight:700}.lab .say.angry:after{border-top-color:#ff4d3d}
.lab .card{display:none;width:26px;height:32px;border-radius:5px;background:#3a3f4a;color:#fff;font:800 14px/32px "Noto Sans SC";text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.25);margin-bottom:2px;transition:transform .35s}
.lab .card.on{display:block}.lab .card.win{background:var(--good)}.lab .card.lose{background:var(--bad)}
.lab.far .nm,.lab.far .st b{display:none}.lab.far .st{padding:3px}
.lab.tiny{display:none}
.lab.help .st{animation:pulse 1s infinite}
.lab.sel .nm{background:var(--acc)}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 6px rgba(239,68,68,.25)}}
.zone{position:absolute;left:0;top:0;font:700 12px "Noto Sans SC";color:#2a2c31;white-space:nowrap;background:rgba(255,255,255,.78);padding:2px 9px;border-radius:5px;letter-spacing:.02em}
body.night .zone{color:#eceef2;background:rgba(18,20,28,.7)}

#top{position:fixed;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.mk{width:36px;height:36px;border-radius:10px;background:var(--acc);display:grid;place-items:center;font:800 15px "Outfit";color:#fff;letter-spacing:-.02em}
.brand b{display:block;font:800 15px/1.1 "Outfit";letter-spacing:.06em}
.brand span{font-size:11.5px;color:var(--mut)}
.mid{flex:1;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#f59e0b}
.pill.live i{background:var(--good);box-shadow:0 0 0 4px rgba(34,197,94,.2)}
#clock{font:600 13px "Outfit";color:var(--mut);white-space:nowrap}
.btns{display:flex;gap:6px;flex:none}
.b{height:36px;min-width:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.b:hover{background:rgba(255,255,255,.12)}.b:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.b.on{background:var(--acc);border-color:var(--acc);color:#fff}
select.b{appearance:none;-webkit-appearance:none;padding-right:12px}
select.b option{background:#1d2026}

#side{position:fixed;right:12px;top:74px;bottom:12px;width:340px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden;z-index:4;transition:transform .3s}
#side.hide{transform:translateX(calc(100% + 20px))}
#avs{display:flex;gap:6px;padding:10px 10px 8px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#avs::-webkit-scrollbar{display:none}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px "Noto Sans SC";color:#fff;position:relative;cursor:pointer;border:2px solid transparent}
.av i{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid #1d2026}
.av.sel{border-color:#fff}
.tabs{display:flex;padding:6px 8px 0;gap:4px;flex:none}
.tab{flex:1;height:36px;border:0;border-radius:9px 9px 0 0;background:transparent;color:var(--mut);font-weight:700;cursor:pointer}
.tab.on{background:rgba(255,255,255,.08);color:#fff}
.tb{flex:1;overflow-y:auto;padding:10px 12px 14px;background:rgba(255,255,255,.04)}
.tb[hidden]{display:none}
.ev{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px}
.ev time{flex:none;font:600 11.5px "Outfit";color:var(--mut);margin-top:2px;width:38px}
.ev.verdict{color:#ffd8cc}.ev.reject{color:#ffb4ab}
.ev b{font-weight:700}
.proj h3{margin:2px 0 2px;font-size:16px;line-height:1.3}
.proj .sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.badge{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.badge.win{background:var(--good);color:#06240f}.badge.lose{background:var(--bad);color:#fff}.badge.run{background:#3b82f6;color:#fff}
.flow{list-style:none;margin:0;padding:0;position:relative}
.flow li{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:13px;color:var(--mut);position:relative}
.flow li:before{content:"";flex:none;width:12px;height:12px;border-radius:50%;border:2px solid #4b5160;background:transparent;z-index:1}
.flow li:not(:last-child):after{content:"";position:absolute;left:5px;top:20px;bottom:-8px;width:2px;background:#3a3f4a}
.flow li.done{color:#d7dae0}.flow li.done:before{background:var(--good);border-color:var(--good)}
.flow li.cur{color:#fff;font-weight:700}.flow li.cur:before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 4px rgba(255,90,54,.25)}
.flow li small{margin-left:auto;font-size:11px;color:var(--mut);font-weight:500}
.branch{margin:8px 0 0 22px;font-size:12px;color:var(--mut);line-height:1.6}
.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.hist div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;color:#d7dae0}
.mem h4{margin:10px 0 4px;font-size:11.5px;color:var(--mut);font-weight:700}
.mrow{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:9px;cursor:pointer}
.mrow:hover{background:rgba(255,255,255,.06)}
.mrow .c{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.mrow .t{flex:1;font-size:13px;line-height:1.3}
.mrow .t small{display:block;color:var(--mut);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff}
.note{font-size:11.5px;color:var(--mut);margin-top:10px;line-height:1.5}

#t-chat{display:flex;flex-direction:column;padding:0;overflow:hidden}
#t-chat[hidden]{display:none}
.chead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.chead select{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:#23262d;color:#fff;font-size:15px;padding:0 10px}
.chead .b{height:40px}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.m{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:4px}
.m.err{align-self:center;background:rgba(239,68,68,.15);color:#ffc9c9;font-size:12.5px}
.m .who{display:block;font-size:11px;font-weight:700;margin-bottom:2px;opacity:.75}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px;flex:none}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;min-height:32px}
.chip:hover{background:rgba(255,255,255,.12)}
.cform{display:flex;gap:6px;padding:8px 10px 10px;border-top:1px solid var(--line);flex:none}
.cform textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font:16px/1.4 "Noto Sans SC",system-ui,sans-serif;padding:10px}
.cform textarea:focus{outline:2px solid var(--acc);outline-offset:0}
.cform .b{height:44px;align-self:flex-end}
.cnote{font-size:11.5px;color:var(--mut);padding:0 12px 8px;flex:none}
.cnote input{width:100%;margin-top:6px;height:40px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:16px;padding:0 10px}
#info .talk{margin-top:10px;width:100%}
#legend{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:12px;z-index:3;max-width:calc(100% - 380px)}
#legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
#legend i{width:9px;height:9px;border-radius:50%}

#info{position:fixed;left:12px;top:74px;width:260px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:4;display:none}
#info.on{display:block}
#info h3{margin:0 0 2px;font-size:16px}#info .r{color:var(--mut);font-size:12.5px}
#info .s{margin-top:8px;font-size:13px}#info .x{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--mut)}

#verdict{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(440px,calc(100% - 24px));background:#fbfaf7;color:#16181d;border-radius:16px;padding:22px 22px 18px;box-shadow:0 30px 80px rgba(0,0,0,.45);z-index:9;opacity:0;pointer-events:none;transition:.3s}
#verdict.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#verdict .k{font-size:12px;font-weight:700;color:#7a6f63;letter-spacing:.08em}
#verdict h2{margin:4px 0 10px;font-size:22px;line-height:1.25}
#verdict .score{display:flex;align-items:baseline;gap:12px;margin:6px 0 12px}
#verdict .score b{font:800 46px/1 "Outfit"}
#verdict .score span{font-size:18px;font-weight:900;padding:3px 12px;border-radius:999px;color:#fff}
#verdict ul{margin:0 0 10px;padding:0;list-style:none;font-size:13.5px}
#verdict li{padding:5px 0;border-bottom:1px solid #e6e1d8;display:flex;gap:8px}
#verdict li em{flex:none;font-style:normal;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:5px;height:fit-content;margin-top:1px}
#verdict .fix{font-size:13.5px;background:#f1ece3;border-radius:10px;padding:9px 11px}
#verdict .x{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;font-size:20px;cursor:pointer;color:#7a6f63}

#err{position:fixed;inset:0;display:none;place-items:center;background:#16181d;color:#fff;text-align:center;padding:24px;z-index:20}
#err.on{display:grid}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#e9e6e0;color:#16181d;z-index:15;transition:opacity .5s}
#loading.off{opacity:0;pointer-events:none}
#loading .mk{width:56px;height:56px;font-size:22px;margin:0 auto 12px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
#sideToggle{display:none}

@media (max-width:760px){
  #top{left:8px;right:8px;top:8px;padding:6px 8px;flex-wrap:wrap;gap:6px}
  .brand span{display:none}.brand b{font-size:13px}.mk{width:32px;height:32px;font-size:13px}
  .mid{order:3;flex-basis:100%;justify-content:flex-start}
  .btns{margin-left:auto}.b{padding:0 9px;font-size:12.5px}
  #side{left:8px;right:8px;width:auto;top:auto;bottom:8px;height:44vh}
  #side.hide{transform:translateY(calc(100% - 96px))}
  #legend{display:none}
  #info{top:auto;bottom:calc(44vh + 16px);left:8px;width:auto;right:8px}
  #sideToggle{display:inline-block}
  .lab .nm{font-size:10px}.lab .st{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loading"><div><div class="mk">CX</div><div style="font-weight:700">正在布置 Connext Media 办公室…</div></div></div>
<div id="stage"></div>
<div id="labels"></div>

<header id="top">
  <div class="brand"><div class="mk">CX</div><div><b>CONNEXT MEDIA</b><span>AI 带货影片团队 · 3D 办公室</span></div></div>
  <div class="mid"><span id="mode" class="pill"><i></i><span>演示模式</span></span><span id="clock"></span></div>
  <div class="btns">
    <select id="view" class="b" aria-label="视角">
      <option value="all">全景</option><option value="desks">开放工位</option><option value="meeting">会议室</option>
      <option value="court">法庭</option><option value="boss">老板室</option><option value="lounge">休息区</option>
    </select>
    <button id="bNight" class="b" type="button">夜晚</button>
    <button id="bDemo" class="b" type="button">演示</button>
    <button id="sideToggle" class="b" type="button">面板</button>
  </div>
</header>

<aside id="side">
  <div id="avs"></div>
  <div class="tabs" role="tablist">
    <button class="tab on" data-t="feed" type="button">动态</button>
    <button class="tab" data-t="flow" type="button">流程</button>
    <button class="tab" data-t="team" type="button">成员</button>
    <button class="tab" data-t="chat" type="button">对话</button>
  </div>
  <div class="tb" id="t-feed"></div>
  <div class="tb" id="t-flow" hidden></div>
  <div class="tb" id="t-team" hidden></div>
  <div class="tb" id="t-chat" hidden>
    <div class="chead"><select id="chatBot" aria-label="选择对话对象"></select><button class="b" id="chatClear" type="button" title="清空这段对话">清空</button></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="cnote" id="cnote"></div>
    <form class="cform" id="cform"><textarea id="cinput" rows="1" placeholder="对他说点什么…（Enter 发送，Shift+Enter 换行）"></textarea><button class="b on" type="submit">发送</button></form>
  </div>
</aside>

<div id="legend"></div>
<div id="info"><button class="x" type="button" aria-label="关闭">×</button><div id="infoBody"></div></div>
<div id="verdict" role="dialog" aria-label="判决书"><button class="x" type="button" aria-label="关闭">×</button><div id="vBody"></div></div>
<div id="err"><div><h2>3D 场景无法载入</h2><p id="errMsg">请使用较新的 Chrome / Safari 打开，或检查网络。</p></div></div>

  if (ra === rb) return [[b.x, b.z]];
  const out = exitPts(ra), inn = exitPts(rb).slice().reverse();
  const A = out.length ? out[out.length - 1] : [a.x, a.z], B = inn.length ? inn[0] : [b.x, b.z];
  const mid = [];

async function connect() {
  if (!/^https?:$/.test(location.protocol)) return false;
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return false;
    const s = await r.json(); if (!s || !Array.isArray(s.bots)) return false;
    live = true; applyState(s); setMode();
    try {
      es = new EventSource('api/stream');
      es.addEventListener('state', ev => { try { applyState(JSON.parse(ev.data)); } catch (e) {} });
      es.onerror = () => { if (es.readyState === 2) startPolling(); };
    } catch (e) { startPolling(); }
    return true;
  } catch (e) { return false; }
}

  clearInterval(pollT);

}

  else if (eng === 'grok') n.innerHTML = '由 Grok 回复 · <a href="#" id="bossOut" style="color:inherit">退出老板身份</a>';

  else n.textContent = live ? '服务器还没设置 XAI_API_KEY，暂时不能对话。' : '这个页面暂时不能对话：部署到 Render 并设置 XAI_API_KEY 后即可使用。';
  const k = $('#bossKey'); if (k) k.addEventListener('change', () => { bossToken.set(k.value.trim()); renderChat(); });

function openChat(id) {

async function sendChat(text) {
  text = text.trim(); if (!text || chatBusy) return;
  await getSample();
  const eng = chatEngine();
  if (!eng) { renderChat(); return; }
  if (eng === 'grok' && !bossToken.get()) { renderChat(); return; }
  const id = chatWith, b = bots.get(id); if (!b) return;
  const hist = chats[id] = (chats[id] || []).filter(m => !m.err);
  hist.push({ role: 'user', content: text }); if (hist.length > 40) hist.splice(0, hist.length - 40);
  saveChats(); renderChat();
  chatBusy = true; const btn = $('#cform .b'); btn.disabled = true; btn.textContent = '…';
  const live_ = document.createElement('div'); live_.className = 'm bot'; live_.innerHTML = `<span class="who">${esc(b.d.name)}</span>思考中…`;

  else { hist.push({ role: 'assistant', content: err || '没有收到回复。', err: true }); b.elSay.classList.remove('on'); b.sayUntil = 0; }

$('#chatBot').addEventListener('change', e => { chatWith = e.target.value; renderChat(); select(chatWith, true); });
$('#chatClear').addEventListener('click', () => { delete chats[chatWith]; saveChats(); renderChat(); });

// ======================= 主循环 =======================
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let labelTick = 0;
function lerpAngle(a, b, t) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return a + d * t; }
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime, nowMs = performance.now();
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt * 1.2); const e = 1 - Math.pow(1 - camTween.k, 3);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e); controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.k >= 1) camTween = null;
  }
  controls.update();
  bots.forEach(b => {
    const p = b.g.position, A = b.arms, L = b.legs;
    let walking = false;
    if (b.path.length) {
      const [tx, tz] = b.path[0]; const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
      const step = b.walkSpeed * dt;
      if (d <= step) { p.x = tx; p.z = tz; b.path.shift(); }
      else { p.x += dx / d * step; p.z += dz / d * step; b.ry = lerpAngle(b.ry, Math.atan2(dx, dz), Math.min(1, dt * 10)); }
      walking = true; p.y += (0 - p.y) * Math.min(1, dt * 10);
      if (!b.path.length) { b.sit = !!b.target.sit; b.sitY = b.target.y || 0; }
    } else {
      b.ry = lerpAngle(b.ry, b.target ? b.target.ry : b.ry, Math.min(1, dt * 6));
      p.y += ((b.sit ? b.sitY : 0) - p.y) * Math.min(1, dt * 8);
    }
    b.g.rotation.y = b.ry;
    const ph = t + b.phase;
    let la = 0, ra = 0, raz = 0, laz = 0, hx = 0, hz = 0, ll = 0, rl = 0, bob = 0;
    if (walking) { const s = Math.sin(ph * 10); ll = s * 0.6; rl = -s * 0.6; la = -s * 0.5; ra = s * 0.5; bob = Math.abs(Math.cos(ph * 10)) * 0.06; }
    else {
      if (b.sit) { ll = rl = -Math.PI / 2; }
      const st = b.status, justDone = st === 'done' && t - b.doneAt < 2.2;
      if (justDone) { la = ra = -2.7; laz = 0.3; raz = -0.3; bob = Math.abs(Math.sin(ph * 9)) * 0.18; }
      else if (st === 'working') { la = -1.15 + Math.sin(ph * 14) * 0.12; ra = -1.15 - Math.sin(ph * 14) * 0.12; hx = 0.12; }
      else if (st === 'thinking') { ra = -2.3; raz = 0.5; hz = Math.sin(ph * 1.2) * 0.15; hx = -0.08; }
      else if (st === 'browsing') { la = ra = -1.0; hz = Math.sin(ph * 0.8) * 0.25; }
      else if (st === 'help') { ra = -2.9; raz = -0.2 + Math.sin(ph * 8) * 0.35; hx = -0.1; }
      else { la = ra = Math.sin(ph * 1.5) * 0.05; bob = Math.sin(ph * 2) * 0.012; }
      if (b.sayUntil > nowMs) { hx += Math.sin(ph * 7) * 0.08; if (st === 'idle' || st === 'done') { ra = -0.9 + Math.sin(ph * 5) * 0.25; } }
    }
    L[0].rotation.x = ll; L[1].rotation.x = rl;
    A[0].rotation.x = la; A[1].rotation.x = ra; A[0].rotation.z = laz; A[1].rotation.z = raz;
    b.head.rotation.x = hx; b.head.rotation.z = hz; b.inner.position.y = bob;
    if (b.sayUntil && b.sayUntil < nowMs) { b.elSay.classList.remove('on'); b.sayUntil = 0; }
  });
  stepConfetti(dt);
  renderer.render(scene, camera);
  updateLabels();
}
const zoneEls = ZONES.map(([n, x, z]) => { const el = document.createElement('div'); el.className = 'zone'; el.textContent = n; labelsEl.appendChild(el); return { el, v: new THREE.Vector3(x, 0.1, z) }; });
function project(v) { tmpV.copy(v).project(camera); return tmpV.z < 1 && Math.abs(tmpV.x) < 1.2 && Math.abs(tmpV.y) < 1.2 ? [(tmpV.x + 1) / 2 * innerWidth, (1 - tmpV.y) / 2 * innerHeight] : null; }
const headV = new THREE.Vector3();
function updateLabels() {
  const camD = camera.position.distanceTo(controls.target);
  const far = camD > (isMobile ? 44 : 52), tiny = camD > 95;
  bots.forEach(b => {
    headV.set(b.g.position.x, b.g.position.y + 2.35, b.g.position.z);

}
